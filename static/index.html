<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1419">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="İddia Oran">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>İddia Oran Öneri</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/legal.css">
  <link rel="stylesheet" href="/static/coupon-history.css">
  <link rel="stylesheet" href="/static/slip.css">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/simple.css">
</head>
<body>
  <a class="skip-link" href="#main">İçeriğe geç</a>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">⚽</span> <b>İddia Oran</b> </div>
    <div class="update">
      <span id="lastUpdate" class="muted"></span>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Temayı değiştir" title="Tema">◐</button>
      <button id="btnUpdate" class="btn hidden">Güncelle</button>
      <span id="authBox"></span>
    </div>
  </header>
  <nav class="tabs" aria-label="Ana menü">
    <button data-tab="matches" class="active" aria-current="page"><i aria-hidden="true">⚽</i><span>Bugün</span></button>
    <button data-tab="coupons"><i aria-hidden="true">🎫</i><span>Kupon</span> <span id="slipCount" class="badge-count hidden">0</span></button>
    <button data-tab="report"><i aria-hidden="true">📈</i><span>Karne</span></button>
  </nav>
  <div id="updateBar" class="update-bar hidden"></div>

  <main id="main">
    <div id="leagueChips" class="chips"></div>

    <section id="tab-matches" class="tab">
      <div id="today"></div>
      <div id="oddsDrops"></div>
      <div id="matches" class="match-list"></div>
      <div id="table"></div>
    </section>

    <div id="couponSeg" class="seg hidden" role="group" aria-label="Kupon bölümleri">
      <button type="button" data-tab="coupons" class="active" aria-pressed="true">Günün kuponu</button>
      <button type="button" data-tab="slip" aria-pressed="false">Kuponum</button>
      <button type="button" data-tab="coupon-history" aria-pressed="false">Geçmiş</button>
      <button type="button" data-tab="ledger" aria-pressed="false">Defter</button>
    </div>

    <section id="tab-coupons" class="tab hidden">
      <div class="toolbar coupon-toolbar"><button id="couponPrev" class="btn">‹ Önceki gün</button><label>Gün: <input id="couponDate" type="date"></label><button id="couponNext" class="btn">Sonraki gün ›</button></div>
      <div id="coupons"></div>
    </section>

    <section id="tab-report" class="tab hidden">
      <div id="modelReport"></div>
    </section>

    <section id="tab-coupon-history" class="tab hidden">
      <div id="couponHistory"></div>
    </section>

    <section id="tab-slip" class="tab hidden">
      <div id="slip"></div>
    </section>

    <section id="tab-ledger" class="tab hidden">
      <div id="ledger"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-body" id="modalBody"></div>
  </div>

  <footer class="muted legal-footer">18+ · Tahminler garanti değildir, yatırım tavsiyesi değildir. Sorumlu oynayın.</footer>
  <script src="/static/ui.js"></script>
  <script src="/static/legal.js"></script>
  <script src="/static/odds-history.js"></script>
  <script src="/static/match-insights.js"></script>
  <script src="/static/simple.js"></script>
  <script src="/static/slip-calc.js"></script>
  <script src="/static/system-calc.js"></script>
  <script src="/static/slip.js"></script>
  <script src="/static/extras.js"></script>
  <script src="/static/match-events.js"></script>
  <script src="/static/coupon-view.js"></script>
  <script src="/static/coupon-share.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/session.js"></script>
  <script src="/static/today.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/pwa.js"></script>
  <script src="/static/coupon-history.js"></script>
  <script src="/static/model-report.js"></script>
</body>
</html>

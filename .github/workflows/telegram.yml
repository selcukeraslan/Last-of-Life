name: Telegram kupon

# Sabah (Türkiye saati 09-15 arası) günlük banko + sürpriz kuponunu, maçlar bitince de sonucu Telegram
# kanalına yazar. Betik idempotenttir: her saat çalışır, ama aynı gün/tür bir kez gönderilir
# (telegram_posts tablosu). TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secret'ı yoksa sessizce atlar.
on:
  schedule:
    - cron: "20 6-23,0-1 * * *"  # UTC; her saatin 20. dakikası (veri güncelleme cron'u :00/:30'da)
  workflow_dispatch:
    inputs:
      force:
        description: "Sabah penceresini yok say (bugünün kuponunu hemen gönder)"
        type: boolean
        default: false
      test_day:
        description: "Deneme: bu günün (YYYY-MM-DD) kuponunu TEST başlığıyla gönder, kayıt tutma"
        type: string
        default: ""

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Kupon / sonuç gönder
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_DAY: ${{ inputs.test_day }}
          FORCE_SEND: ${{ inputs.force }}
        run: |
          if [[ -n "$TEST_DAY" ]]; then
            python -m app.telegram_bot --test --day "$TEST_DAY"
          elif [[ "$FORCE_SEND" == "true" ]]; then
            python -m app.telegram_bot --force
          else
            python -m app.telegram_bot
          fi

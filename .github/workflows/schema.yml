name: Schema compatibility
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'scripts/ensure_schema.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schema-compatibility
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/ensure_schema.py
        env:
          REQUIRE_POSTGRES: '1'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

name: Hızlı güncelle

# Hafif artımlı güncelleme (iddaa oranları + ESPN son günler): ~2 dk. Tam güncelleme update.yml'de ayrıdır.
# Sağlık kontrolü başarısız olursa health.yml bunu workflow_dispatch ile de tetikler.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: quick-update
  cancel-in-progress: false

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Hızlı güncelle
        timeout-minutes: 5
        env:
          PYTHONUNBUFFERED: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.updater --quick
